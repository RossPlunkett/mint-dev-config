backend = "glx";
vsync = true;
use-damage = true;

corner-radius = ${RICE_RADIUS};
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -18;
shadow-offset-y = -18;
shadow-color = "${RICE_ACCENT}";

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;

# Blur costs the most on HD 4000: lower strength first if things stutter.
blur-background = true;
blur-method = "dual_kawase";
blur-strength = ${RICE_BLUR};

rules: (
  { match = "fullscreen"; corner-radius = 0; shadow = false; opacity = 1; },
  { match = "window_type = 'dock'"; corner-radius = 0; shadow = false; },
  { match = "window_type = 'tooltip' || window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu'"; shadow = false; blur-background = false; },
  { match = "class_g ~= '(?i)firefox|chrom|brave|mpv|vlc|gimp|inkscape|blender'"; opacity = 1; },
  { match = "class_g != 'kitty' && window_type = 'normal' && !focused"; opacity = 0.88; },
  { match = "class_g != 'kitty' && window_type = 'normal' && focused"; opacity = 0.95; }
);

animations = (
  { triggers = ["open", "show"]; preset = "appear"; scale = 0.92; duration = 0.16; },
  { triggers = ["close", "hide"]; preset = "disappear"; scale = 0.92; duration = 0.12; },
  { triggers = ["geometry"]; preset = "geometry-change"; duration = 0.16; }
);
