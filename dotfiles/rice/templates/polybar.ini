[colors]
bg = #B3${RICE_BG_HEX}
fg = ${RICE_FG}
muted = ${RICE_FG_MUTED}
accent = ${RICE_ACCENT}
alert = ${RICE_RED}
sel = #E6${RICE_SELECTION_HEX}

[bar/main]
monitor = ${env:RICE_MONITOR:}
width = 100%
height = 26
offset-y = 0
background = ${colors.bg}
foreground = ${colors.fg}
padding-left = 1
padding-right = 2
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=9.5;2
modules-left = bspwm rice
modules-center = title
modules-right = ${env:RICE_BAR_RIGHT:}
enable-ipc = true
wm-restack = bspwm
cursor-click = pointer

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
label-focused = %name%
label-focused-background = ${colors.sel}
label-focused-foreground = ${colors.accent}
label-focused-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/rice]
type = custom/text
label = 󰏘 ${RICE_LABEL}
format-foreground = ${colors.accent}
format-padding = 1
click-left = rice-theme
click-right = rice-wallpaper pick
scroll-up = rice-wallpaper prev
scroll-down = rice-wallpaper next

[module/title]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.muted}

[module/cpu]
type = internal/cpu
interval = 3
label = 󰍛 %percentage%%
format-foreground = ${colors.accent}

[module/memory]
type = internal/memory
interval = 5
label = 󰘚 %percentage_used%%
format-foreground = ${colors.accent}

[module/wifi]
type = internal/network
interface-type = wireless
interval = 5
label-connected = 󰖩 %essid%
label-disconnected = 󰖪
format-connected-foreground = ${colors.accent}
label-disconnected-foreground = ${colors.muted}

[module/audio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = 󰕾 %percentage%%
format-volume-foreground = ${colors.accent}
label-muted = 󰖁
label-muted-foreground = ${colors.muted}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
label-charging = 󰂄 %percentage%%
label-discharging = 󰁹 %percentage%%
label-full = 󰁹 full
format-charging-foreground = ${colors.accent}
format-discharging-foreground = ${colors.accent}
format-full-foreground = ${colors.accent}

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %H:%M
label = %date%  %time%

[module/tray]
type = internal/tray
tray-spacing = 6px
