# Installed by mint-dev-config scripts/install-audio.sh. grub-mkconfig sources this
# after /etc/default/grub; options already present there are not added twice.
for option in preempt=full threadirqs; do
    case " $GRUB_CMDLINE_LINUX_DEFAULT " in
        *" $option "*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT $option" ;;
    esac
done
